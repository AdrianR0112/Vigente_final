<!doctype html>

    <header class="site-header">
      <a class="brand-lockup" href="#inicio" aria-label="Vigente, volver al inicio">
        <span class="brand-bars" aria-hidden="true"><i></i><i></i><i></i></span>

      <nav class="top-nav" aria-label="Navegación principal">
        <a href="#inicio" data-route="inicio">Inicio</a>

    </header>
    <nav id="mobile-navigation" class="mobile-nav" aria-label="Navegación móvil" hidden></nav>

    <main id="main-content" tabindex="-1">

    <dialog id="document-dialog" class="document-dialog" aria-labelledby="document-title">
      <div class="dialog-head">
        <div><h2 id="document-title">Documento</h2><p id="document-description"></p></div>
        <button class="icon-button" type="button" data-close-dialog aria-label="Cerrar documento"><svg><use href="#i-close" /></svg></button>
      </div>
      <div class="document-frame-wrap"><iframe id="document-frame" title="Vista previa del documento"></iframe></div>
      <div class="dialog-actions">
        <a id="document-open" class="button secondary" target="_blank" rel="noreferrer"><svg><use href="#i-external" /></svg>Abrir en otra pestaña</a>
        <button class="button ghost" type="button" data-close-dialog>Cerrar</button>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
